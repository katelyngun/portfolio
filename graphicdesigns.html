<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphic Design — Katelyn Gunawan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --text-dark: #2c2c2c;
      --text-mid: #555;
      --accent: #c47a8a;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Urbanist', sans-serif;
      font-weight: 300;
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      letter-spacing: 0.04em;
      line-height: 1.9;
    }
    #bg-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: -1; pointer-events: none;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 80px;
    }
            .nav-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      background: linear-gradient(110deg, rgba(252,210,225,0.55) 0%, rgba(255,243,210,0.45) 100%);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.70);
      border-radius: 100px;
      padding: 4px 16px 4px 6px;
      box-shadow: 0 4px 24px rgba(240,160,185,0.18), 0 1px 8px rgba(240,180,170,0.12),
                  0 0 0 1px rgba(255,255,255,0.25) inset;
    }
    .nav-logo img {
      height: 46px; object-fit: contain; display: block;
      transition: transform 0.3s ease;
    }
    .nav-logo span {
      font-family: 'Urbanist', sans-serif;
      font-size: 1.05rem; font-weight: 400;
      color: var(--text-dark); letter-spacing: 0.04em;
      transition: color 0.3s ease;
    }
    .nav-logo:hover img   { transform: scale(1.15); }
    .nav-logo:hover span  { color: #7a9e6e; }
    .nav-pills {
      display: flex; list-style: none;
      background: linear-gradient(110deg, rgba(252,210,225,0.55) 0%, rgba(255,243,210,0.45) 100%);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.70);
      border-radius: 100px; padding: 5px;
      box-shadow: 0 4px 24px rgba(240,160,185,0.18), 0 1px 8px rgba(240,180,170,0.12),
                  0 0 0 1px rgba(255,255,255,0.25) inset;
    }
    .nav-pills li a {
      display: block; padding: 8px 20px; border-radius: 100px;
      font-size: 0.83rem; font-weight: 400; color: var(--text-dark);
      text-decoration: none; white-space: nowrap; letter-spacing: 0.03em;
      transition: background 0.2s;
    }
    .nav-pills li a.active,
    .nav-pills li a:hover {
      background: rgba(255,248,251,0.9); box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    /* ── HERO ── */
    .hero {
      padding: 110px 100px 40px;
      display: flex; align-items: flex-end;
    }
    .hero-title {
      font-size: clamp(2.2rem, 4vw, 3.2rem); font-weight: 700;
      color: var(--text-dark); line-height: 1.1; letter-spacing: -0.01em;
    }

    /* ── SECTION CARDS ── */
    .sections-wrap {
      padding: 28px 100px 80px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Each section card is a full-width clickable row */
    .section-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.72) 0%, rgba(252,240,245,0.20) 70%);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.75); border-radius: 24px;
      padding: 44px 60px;
      cursor: pointer;
      text-decoration: none; color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 32px rgba(210,140,170,0.20), 0 2px 8px rgba(200,120,155,0.08);
    }
    .section-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 52px rgba(210,140,170,0.26), 0 4px 12px rgba(200,120,155,0.12);
    }

    /* Card footer: centered title + view button below photos */
    .card-footer {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .card-title {
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 600; letter-spacing: 0.02em; color: var(--text-dark);
      text-align: center;
    }
    .btn-view {
      display: inline-block;
      padding: 10px 28px;
      border-radius: 100px;
      border: 1.5px solid #b0c060;
      background: rgba(176,192,80,0.12);
      color: #5e6e2a;
      font-size: 0.82rem; font-weight: 500; letter-spacing: 0.04em;
      font-family: inherit;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      cursor: pointer; text-decoration: none;
    }
    .section-card:hover .btn-view {
      background: #c8d98a; color: #4a5820; border-color: #c8d98a;
    }

    /* ── 4-IMAGE STRIP ── */
    /* 4 portrait images displayed side by side, slightly overlapping + rotated */
    .img-strip {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      width: 100%;
      transition: gap 0.35s ease;
    }

    .strip-img-wrap {
      flex: 0 0 auto;
      width: 21%;
      position: relative;
      transition: transform 0.35s ease, margin-right 0.35s ease;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 32px rgba(180,110,140,0.22), 0 2px 8px rgba(0,0,0,0.08);
    }

    /* Slight stagger/rotation per position */
    .strip-img-wrap:nth-child(1) { transform: rotate(-4deg) translateY(6px);  margin-right: -22px; z-index: 1; }
    .strip-img-wrap:nth-child(2) { transform: rotate(-1.5deg) translateY(-4px); margin-right: -22px; z-index: 2; }
    .strip-img-wrap:nth-child(3) { transform: rotate(1.5deg) translateY(-4px); margin-right: -22px; z-index: 2; }
    .strip-img-wrap:nth-child(4) { transform: rotate(4deg) translateY(6px);  z-index: 1; }

    .section-card:hover .img-strip { gap: 12px; }
    .section-card:hover .strip-img-wrap:nth-child(1) { transform: rotate(-4deg) translateY(0px); margin-right: 0; }
    .section-card:hover .strip-img-wrap:nth-child(2) { transform: rotate(-1.5deg) translateY(-8px); margin-right: 0; }
    .section-card:hover .strip-img-wrap:nth-child(3) { transform: rotate(1.5deg) translateY(-8px); margin-right: 0; }
    .section-card:hover .strip-img-wrap:nth-child(4) { transform: rotate(4deg) translateY(0px); }

    /* For landscape images: use a fixed height + object-fit instead of aspect-ratio */
    .strip-img-wrap img {
      width: 100%;
      aspect-ratio: 4 / 5;   /* ← DEFAULT portrait ratio — override per card if needed */
      object-fit: cover;
      display: block;
    }

    /* Princess & Pea cover — match the 4:5 ratio of other cards */
    .pea-card .strip-img-wrap img {
      aspect-ratio: 4 / 5;
    }

    footer {
      text-align: center; padding: 40px;
      font-size: 0.78rem; color: rgba(80,50,65,0.45); letter-spacing: 0.05em;
    }

    @media (max-width: 800px) {
      nav { padding: 14px 20px; }
      .nav-pills li a { padding: 7px 13px; font-size: 0.75rem; }
      .hero { padding: 90px 28px 28px; }
      .sections-wrap { padding: 20px 28px 60px; gap: 20px; }
      .section-card { padding: 28px 24px; }
      .strip-img-wrap { width: 26%; }
      .strip-img-wrap:nth-child(1) { margin-right: -14px; }
      .strip-img-wrap:nth-child(2) { margin-right: -14px; }
      .strip-img-wrap:nth-child(3) { margin-right: -14px; }
    }

    /* ── FADE-IN ON SCROLL ── */
    .fade-in {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── MOBILE RESPONSIVE ── */
    @media (max-width: 768px) {
      nav {
        padding: 12px 20px;
      }
      .nav-logo img { height: 32px; }
      .nav-logo span { font-size: 0.78rem; }
      .nav-logo { padding: 3px 10px 3px 4px; gap: 6px; }
      .nav-pills li a { padding: 6px 10px; font-size: 0.7rem; }
      .nav-pills { padding: 3px; }
    }
    @media (max-width: 480px) {
      .nav-pills li a { padding: 5px 8px; font-size: 0.65rem; letter-spacing: 0; }
      .nav-logo span { display: none; }
      .nav-logo img { height: 30px; }
    }
  </style>
</head>

<script>
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, scrollY = 0, mouse = { x: -999, y: -999 };
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
window.addEventListener('scroll', () => { scrollY = window.scrollY; });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });
const bubbles = [];
function bubbleColor(n) {
  return n < 0.45
    ? [[250,210,220],[252,220,210],[248,205,218],[252,225,215]][Math.floor(Math.random()*4)]
    : [[220,235,180],[228,235,175],[235,230,185],[225,232,178],[232,235,182]][Math.floor(Math.random()*5)];
}
for (let i = 0; i < 38; i++) {
  const y = Math.random(); const [r,g,b] = bubbleColor(y);
  bubbles.push({ x: Math.random()*1.2-0.1, y, pageH: 2.8, r0: 14+Math.random()*38,
    drift: (Math.random()-0.5)*0.00018, floatSpeed: 0.00008+Math.random()*0.00012,
    floatAmp: 6+Math.random()*14, floatOffset: Math.random()*Math.PI*2,
    alpha: 0.62+Math.random()*0.20, r, g, b, vx: 0, vy: 0 });
}
const wave = { amp:18, freq:0.0045, speed:0.012, phase:0, yBase:0.88 };
let t = 0;
function draw() {
  t++;
  ctx.clearRect(0,0,W,H);
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#fce8ef'); grad.addColorStop(0.45,'#fef0f4'); grad.addColorStop(1,'#ffffff');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  bubbles.forEach(b => {
    const sx = b.x*W, sy = b.y*b.pageH*H - scrollY + Math.sin(t*b.floatSpeed*60+b.floatOffset)*b.floatAmp;
    if (sy < -80 || sy > H+80) return;
    b.x += b.drift; if(b.x<-0.1) b.x=1.1; if(b.x>1.1) b.x=-0.1;
    const dx=sx-mouse.x, dy=sy-mouse.y, md=Math.sqrt(dx*dx+dy*dy);
    if(md<140&&md>0){const f=(140-md)/140*0.5; b.vx+=(dx/md)*f; b.vy+=(dy/md)*f;}
    b.vx*=0.9; b.vy*=0.9;
    const bx=b.x*W+b.vx, by=sy+b.vy;
    const fill=ctx.createRadialGradient(bx,by,0,bx,by,b.r0);
    fill.addColorStop(0,`rgba(${b.r},${b.g},${b.b},${b.alpha})`);
    fill.addColorStop(0.6,`rgba(${b.r},${b.g},${b.b},${b.alpha*0.6})`);
    fill.addColorStop(1,`rgba(${b.r},${b.g},${b.b},0)`);
    ctx.beginPath(); ctx.arc(bx,by,b.r0,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill();
  });
  wave.phase+=wave.speed;
  const waveY=wave.yBase*H-scrollY*0.15;
  ctx.save();
  [[wave.freq,wave.phase,1.5,'rgba(210,125,160,0.6)','rgba(235,150,180,0)'],
   [wave.freq*0.85,wave.phase*0.8+1.2,1.2,'rgba(155,200,150,0.4)','rgba(180,215,175,0)']
  ].forEach(([freq,phase,lw,mid,edge],i)=>{
    ctx.beginPath(); ctx.moveTo(0,waveY+(i?24:0)+Math.sin(phase)*wave.amp*(i?0.5:1));
    for(let x=1;x<=W;x+=2) ctx.lineTo(x,waveY+(i?24:0)+Math.sin(x*freq+phase)*wave.amp*(i?0.5:1));
    const g=ctx.createLinearGradient(0,0,W,0);
    g.addColorStop(0,edge); g.addColorStop(0.5,mid); g.addColorStop(1,edge);
    ctx.strokeStyle=g; ctx.lineWidth=lw; ctx.stroke();
  });
  ctx.restore();
  if(mouse.x>0){
    const mg=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,200);
    mg.addColorStop(0,'rgba(250,185,210,0.22)'); mg.addColorStop(0.5,'rgba(250,185,210,0.08)');
    mg.addColorStop(1,'rgba(250,185,210,0)'); ctx.fillStyle=mg;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,200,0,Math.PI*2); ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
